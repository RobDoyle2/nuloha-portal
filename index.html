<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuloha</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(160deg,#0f2a4a,#1b6b6f);color:#fff;text-align:center}
  h1{margin:0;font-size:clamp(44px,12vw,84px);letter-spacing:2px}
  button{font:inherit;font-size:22px;font-weight:700;padding:14px 40px;border:0;border-radius:999px;background:#ffd23f;color:#3a2a00;cursor:pointer}
  #games{display:none;flex-direction:column;gap:12px;width:100%;max-width:360px}
  #games.open{display:flex}
  #games a{display:block;padding:16px;border-radius:16px;background:rgba(255,255,255,.14);color:#fff;font-size:20px;font-weight:600;text-decoration:none}
</style>
</head>
<body>
  <h1>Nuloha</h1>
  <button id="btn" aria-expanded="false">Games</button>
  <div id="games">
    <a href="https://robdoyle2.github.io/games/spider-takedown/">🕷️ Spider Takedown</a>
  </div>
  <script>
    var b=document.getElementById('btn'),g=document.getElementById('games');
    b.onclick=function(){var o=g.classList.toggle('open');b.setAttribute('aria-expanded',o);};
  </script>
</body>
</html>
